name: CI

on:
  push:
    branches: [main]
  pull_request:

# least-privilege default for every job below - none of them push, publish,
# or otherwise need more than reading the checked-out code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install python dependencies
        run: make install

      - name: Run tests
        run: make test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install

      # `npm run build` runs `tsc -b` before `vite build`, so this also
      # type-checks the whole frontend
      - name: Type-check and build frontend
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: make build
